# 测试环境配置 - 直接引用主配置
spring.config.import=classpath:application.properties

# 覆盖部分配置用于测试
spring.jpa.show-sql=false
logging.level.org.dachuang_team.dc_backend_services=DEBUG

# OSS 配置（覆盖环境变量配置，使用模拟值）
aliyun.oss.endpoint=oss-cn-guangzhou.aliyuncs.com
aliyun.oss.access-key-id=test-access-key-id
aliyun.oss.access-key-secret=test-access-key-secret
aliyun.oss.bucket-name=test-bucket

# Redis 配置（测试时使用模拟配置）
spring.data.redis.host=localhost
spring.data.redis.port=6379
